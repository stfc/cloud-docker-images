# StackStorm WebUI - running behind oauth2 reverse proxy 
# Install to: /etc/nginx/conf.d/st2.conf

# most of this config is the same as here: 
# https://raw.githubusercontent.com/StackStorm/st2/v3.9/conf/nginx/st2.conf
# with a few tweaks to make it work with our docker-compose oidc setup

# set X-Forwarded-Proto from oauth2-proxy
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
    http    http;
}

# user identity that's handed to st2 from oauth2.
# oauth2-proxy sets the user as a uuid by default
# but X-Forwarded-Email is a better identifier for RBAC/audit
# so set X-Forwarded-Email as default for $st2_remote_user
map $http_x_forwarded_email $st2_remote_user {
    ""      $http_x_forwarded_user;
    default $http_x_forwarded_email;
}

server {

    listen 8080 default_server;
    server_name _;
    server_tokens off;

    root  /opt/stackstorm/static/webui/;
    index index.html;

    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    client_max_body_size 0;
    large_client_header_buffers 4 32k;
    underscores_in_headers off;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    resolver         127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    set_real_ip_from  172.28.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Named error locations
    # Each load security headers see snippets/st2-security-headers.conf

    location @apiError {
        add_header Content-Type application/json always;
        include /etc/nginx/snippets/st2-security-headers.conf;
        return 503 '{ "faultstring": "Nginx is unable to reach st2api. Make sure service is running." }';
    }

    location @authError {
        add_header Content-Type application/json always;
        include /etc/nginx/snippets/st2-security-headers.conf;
        return 503 '{ "faultstring": "Nginx is unable to reach st2auth. Make sure service is running." }';
    }

    location @streamError {
        add_header Content-Type text/event-stream always;
        include /etc/nginx/snippets/st2-security-headers.conf;
        return 200 "retry: 1000\n\n";
    }

    location @noIdentity {
        add_header Content-Type application/json always;
        include /etc/nginx/snippets/st2-security-headers.conf;
        return 403 '{ "faultstring": "No authenticated identity was presented. Sign in again." }';
    }

    # for health checks
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Backward-compatible stream rewrites - taken from stock st2web nginx conf
    rewrite ^/api/stream/?$        /stream/v1/stream break;
    rewrite ^/api/(v\d)/stream/?$  /stream/$1/stream break;

    # /api/  st2api
    location ^~ /api/ {
        error_page 502 504 = @apiError;

        set $upstream_api http://st2api:9101;

        rewrite ^/api/(.*) /$1 break;
        proxy_pass $upstream_api;

        # st2api authenticates by StackStorm token
        # strip any inbound identity headers from OIDC as they don't need to be forwarded.
        proxy_set_header X-Forwarded-User "";
        proxy_set_header REMOTE_USER "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    90s;
        proxy_send_timeout    90s;

        include /etc/nginx/snippets/st2-proxy.conf;
        include /etc/nginx/snippets/st2-security-headers.conf;

        gzip            on;
        gzip_min_length 1024;
        gzip_types      application/json text/plain;
        gzip_proxied    any;
        gzip_vary       on;
    }

    # /stream/  st2stream (SSE)
    location ^~ /stream/ {
        error_page 502 504 = @streamError;

        set $upstream_stream http://st2stream:9102;

        rewrite ^/stream/(.*) /$1 break;
        proxy_pass $upstream_stream;

        # st2stream authenticates by StackStorm token
        # strip any inbound identity headers from OIDC as they don't need to be forwarded.
        proxy_set_header X-Forwarded-User "";
        proxy_set_header REMOTE_USER "";

        proxy_connect_timeout 10s;

        # set timeout higher for st2stream to allow large data transfers
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        tcp_nodelay on;

        include /etc/nginx/snippets/st2-proxy.conf;
        include /etc/nginx/snippets/st2-security-headers.conf;

        gzip off;
    }

    # /auth/ st2auth in PROXY MODE

    # In proxy mode st2auth does not validate credentials. 
    # That's done by oauth2-proxy in front 
    # It instead creates and validates session tokens 

    location ^~ /auth/ {
        # An empty identity must never reach st2auth.
        # when this is set - we know we've authenticated correctly via oauth2-proxy 
        if ($st2_remote_user = "") {
            return 403;
        }
        error_page 403     = @noIdentity;
        error_page 502 504 = @authError;

        set $upstream_auth http://st2auth:9100;

        rewrite ^/auth/(.*) /$1 break;
        proxy_pass $upstream_auth;

        # Set both headers - REMOTE_USER and X-Forwarded-User for st2auth to read 
        # which one st2auth uses is not clear, setting both avoids bugs betweeen different 
        # versions of st2auth

        # proxy_set_header replaces any client-supplied value - prevents spoofing names/emails.
        proxy_set_header REMOTE_USER      $http_x_forwarded_user;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;

        # st2auth ignores Authorization in proxy mode; clear this header
        proxy_set_header Authorization "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    90s;

        include /etc/nginx/snippets/st2-proxy.conf;
        include /etc/nginx/snippets/st2-security-headers.conf;
    }

    # Static assets
    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/st2-security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    
    # auth.html - loads token from st2auth into local session cookie  
    location = /auth.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/st2-security-headers.conf;
        try_files /auth.html =404;
    }

    # st2web SPA (single page application)
    location / {
        max_ranges 0;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/st2-security-headers.conf;

        # checks if there's a session cookie present - if not - creates one
        # it assumes you've already authenticated via oauth2-proxy 
        if ($http_cookie !~* "auth-token") {
            rewrite ^(.*)$ /auth.html last;
        }

        try_files $uri $uri/ /index.html;
    }
}
