name: Username Service Test and Lint

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - ".github/workflows/username_service.yaml"
      - "stfc-username-service/**"

jobs:
  golangci-lint:
    name: runner / golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: golangci-lint
        # https://github.com/golangci/golangci-lint-action/releases
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: stfc-username-service/

  run_tests:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout/releases
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        # https://github.com/docker/setup-buildx-action/releases
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Run tests in container
        # https://github.com/docker/build-push-action/releases
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          no-cache: true
          cache-to: type=gha,mode=max
          target: test-stage
          push: false
          context: "{{defaultContext}}:stfc-username-service"
