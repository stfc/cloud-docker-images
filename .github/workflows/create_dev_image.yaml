name: Create a Dev Image

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: harbor.stfc.ac.uk
  IMAGE_NAMESPACE: stfc-cloud-staging

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      image_paths: ${{ steps.detect.outputs.image_paths }}
    steps:
      # https://github.com/actions/checkout/releases
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # convert image paths into json
          changed_image_paths=$(.github/scripts/detect_changed_images.sh "$BASE_SHA" "$HEAD_SHA" | jq -Rsc 'split("\n") | map(select(length > 0))')
          printf 'changed: %s\n' "$changed_image_paths"
          echo "image_paths=$changed_image_paths" >> "$GITHUB_OUTPUT"

  # version.txt must be bumped, must go up, and must not already be tagged.
  version:
    needs: detect
    if: needs.detect.outputs.image_paths != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image_path: ${{ fromJSON(needs.detect.outputs.image_paths) }}
    steps:
      # https://github.com/actions/checkout/releases
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Check Version Update"
        env:
          IMAGE_PATH: ${{ matrix.image_path }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          .github/scripts/validate_version.sh "$IMAGE_PATH" "$BASE"

  # Build + push a dev image — trusted authors only.
  # Tag format: <version>dev-<short sha>, e.g. 1.0.0dev-ase241f
  dev-image:
    needs: [detect, version]
    # The `env` context isn't available in a job-level `if`, so the trusted-bot
    # list has to be inline.
    if: >-
      ${{ needs.detect.outputs.image_paths != '[]' &&
          (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
           contains(fromJSON('["dependabot[bot]"]'), github.event.pull_request.user.login)) }}

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image_path: ${{ fromJSON(needs.detect.outputs.image_paths) }}
    steps:
      - name: Maximize build space # free up space for building images
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          build-mount-path: "/var/lib/docker/"

      - name: Restart docker # restart the docker service
        run: sudo service docker restart

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to DockerHub # increase pull rate limit
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Harbor
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.STAGING_HARBOR_USERNAME }}
          password: ${{ secrets.STAGING_HARBOR_TOKEN }}

      - env:
          IMAGE_PATH: ${{ matrix.image_path }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH: "true"
          BUILD_CACHE: "1"
        run: bash .github/scripts/build_dev_image.sh "$IMAGE_PATH" "$HEAD_SHA"
